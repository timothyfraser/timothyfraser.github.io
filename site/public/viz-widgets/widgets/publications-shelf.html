<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publications shelf · Timothy Fraser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --fg: #1b2333;
      --muted: #5c6478;
      --border: #e8e5df;
      --accent: #b31b1b;
      --accent-2: #8f1515;
      --accent-soft: #f9e8e8;
      --ink-on-red: #ffffff;
      --font-display: 'Source Serif 4', 'Source Serif Pro', Georgia, serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
      --topic-environment: #2d6a4f;
      --topic-transportation: #1d4e89;
      --topic-disaster: #c45c26;
      --topic-social-capital: #6b4c9a;
      --topic-social-infrastructure: #7b5ea7;
      --topic-networks: #5c4d7d;
      --topic-gis: #3d6b8c;
      --topic-polarization: #9b2335;
      --topic-energy: #b8860b;
      --topic-health: #c23b4a;
      --topic-default: #6b6964;
      --shelf-wood: color-mix(in oklch, var(--fg) 18%, var(--bg));
      --page-cream: #f8f6f0;
      --radius: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.55;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 22px 48px; }
    .stripe { height: 4px; background: var(--accent); }
  </style>
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>
  <div class="wrap" id="app">
    <p class="meta">Loading publications from <code>mpvfewsh-publications.csv</code>…</p>
  </div>
  <script type="module">
    import {
      DATA, TOPIC_KEYS, loadText, csvToObjects, topicsForPub, primaryTopic, isTrue, displayField, initEmbedShell, reportEmbedHeight,
    } from '../js/data-source.js';
    initEmbedShell();

    const state = { pubs: [], filter: 'all', sort: 'year-desc', selected: null, tooltip: null };

    const styles = `
    .head { margin-bottom: 24px; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
    h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1.15; }
    .lead { color: var(--muted); max-width: 62ch; margin: 0 0 20px; font-size: 1rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 20px; }
    .toolbar label { font-size: 0.85rem; color: var(--muted); }
    .toolbar select {
      font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; min-width: 200px; }
    .chip {
      font-size: 0.8rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); cursor: pointer; transition: background 0.12s, border-color 0.12s;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.active { background: var(--accent); color: var(--ink-on-red); border-color: var(--accent); }
    .count { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
    .shelf-stack {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .shelf-unit {
      position: relative;
      background: linear-gradient(180deg, color-mix(in oklch, var(--bg) 92%, var(--fg)) 0%, var(--bg) 40%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px 0;
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
    }
    .shelf-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 380px;
      padding-bottom: 10px;
    }
    .book {
      flex: 0 0 auto;
      width: 52px;
      border: none;
      padding: 0;
      cursor: pointer;
      background: transparent;
      position: relative;
      transition: transform 0.22s ease;
      transform-style: preserve-3d;
      perspective: 400px;
    }
    .book:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .book:hover:not(.opening):not(.opened) { transform: translateY(-16px) scale(1.04); z-index: 3; }
    .book.selected { z-index: 4; }
    .book.opening .book-vol,
    .book.opened .book-vol {
      animation: shelf-book-open 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .book.opening .cover-face,
    .book.opened .cover-face {
      animation: cover-swing 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transform-origin: left center;
    }
    .book.opening .pages-edge,
    .book.opened .pages-edge {
      animation: pages-flare 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.12s forwards;
    }
    @keyframes shelf-book-open {
      0% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-24px) scale(1.08) rotateY(-8deg); }
      100% { transform: translateY(-20px) scale(1.06) rotateY(-4deg); }
    }
    @keyframes cover-swing {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(-72deg); }
    }
    @keyframes pages-flare {
      0% { flex-basis: 10px; opacity: 0.7; }
      100% { flex-basis: 18px; opacity: 1; }
    }
    .book-vol {
      display: flex;
      align-items: stretch;
      height: var(--book-h, 120px);
      filter: drop-shadow(2px 4px 6px color-mix(in oklch, var(--fg) 18%, transparent));
    }
    .spine {
      flex: 0 0 44px;
      border-radius: 4px 0 0 4px;
      background: var(--spine-color, var(--topic-default));
      border-left: 3px solid color-mix(in oklch, black 35%, var(--spine-color));
      position: relative;
      overflow: hidden;
    }
    .spine::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, color-mix(in oklch, black 15%, transparent), transparent 55%, color-mix(in oklch, white 18%, transparent));
    }
    .spine-gilt {
      position: absolute;
      left: 4px; right: 4px;
      top: 12%;
      bottom: 12%;
      border-left: 1px solid color-mix(in oklch, white 35%, transparent);
      border-right: 1px solid color-mix(in oklch, black 20%, transparent);
      pointer-events: none;
    }
    .spine-year {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%) rotate(-90deg);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: color-mix(in oklch, white 92%, transparent);
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .pages-edge {
      flex: 0 0 10px;
      background: linear-gradient(90deg, var(--page-cream), #fff 40%, var(--page-cream));
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      box-shadow: inset -1px 0 2px color-mix(in oklch, var(--fg) 8%, transparent);
    }
    .pages-edge::after {
      content: '';
      display: block;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        180deg,
        transparent 0,
        transparent 3px,
        color-mix(in oklch, var(--fg) 6%, transparent) 3px,
        color-mix(in oklch, var(--fg) 6%, transparent) 4px
      );
    }
    .cover-face {
      flex: 0 0 6px;
      background: color-mix(in oklch, black 12%, var(--spine-color));
      border-radius: 0 3px 3px 0;
    }
    .book-tooltip {
      position: fixed;
      z-index: 100;
      max-width: min(320px, 90vw);
      padding: 8px 12px;
      background: var(--fg);
      color: var(--ink-on-red);
      font-size: 0.82rem;
      line-height: 1.35;
      border-radius: var(--radius);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -100%) translateY(-8px);
      transition: opacity 0.12s;
      box-shadow: 0 8px 24px color-mix(in oklch, var(--fg) 30%, transparent);
    }
    .book-tooltip.visible { opacity: 1; }
    .book-tooltip .tt-year {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: color-mix(in oklch, white 70%, transparent);
      display: block;
      margin-top: 4px;
    }
    .shelf-plank {
      height: 18px;
      margin-top: -2px;
      background: var(--shelf-wood);
      border-radius: 0 0 4px 4px;
      box-shadow: 0 5px 0 color-mix(in oklch, var(--fg) 8%, transparent);
    }
    .reader-stage {
      margin-top: 28px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .reader-empty {
      padding: 32px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      width: 100%;
      font-size: 0.95rem;
    }
    .book-open {
      display: flex;
      width: min(720px, 100%);
      perspective: 1200px;
      animation: book-rise 0.45s ease;
    }
    @keyframes book-rise {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: none; }
    }
    .book-open .page {
      flex: 1;
      min-height: 280px;
      padding: 28px 26px;
      background: var(--page-cream);
      border: 1px solid var(--border);
      position: relative;
      box-shadow: inset 0 0 40px color-mix(in oklch, var(--fg) 4%, transparent);
    }
    .book-open .page-left {
      border-radius: 6px 0 0 6px;
      border-right: 2px solid color-mix(in oklch, var(--fg) 12%, var(--border));
      transform-origin: right center;
      animation: page-left-open 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .book-open .page-right {
      border-radius: 0 6px 6px 0;
      border-left: 1px solid var(--border);
      transform-origin: left center;
      animation: page-right-open 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.08s forwards;
    }
    @keyframes page-left-open {
      from { transform: rotateY(28deg); opacity: 0.6; }
      to { transform: rotateY(0deg); opacity: 1; }
    }
    @keyframes page-right-open {
      from { transform: rotateY(-28deg); opacity: 0.6; }
      to { transform: rotateY(0deg); opacity: 1; }
    }
    .book-open .page::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 28px;
      background: linear-gradient(90deg, color-mix(in oklch, var(--fg) 6%, transparent), transparent);
      pointer-events: none;
    }
    .page-left::before { right: 0; }
    .page-right::before { left: 0; transform: scaleX(-1); }
    .page-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 10px;
    }
    .page h2 {
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 2.5vw, 1.45rem);
      font-weight: 600;
      margin: 0 0 12px;
      line-height: 1.3;
    }
    .page-meta { font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; }
    .page-meta .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .page-authors { font-size: 0.95rem; margin: 0 0 16px; }
    .topic-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .pill {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 999px;
      color: var(--ink-on-red);
      background: var(--pill-bg, var(--topic-default));
    }
    .btn-row { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-block;
      padding: 9px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius);
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s;
    }
    .btn-accent { background: var(--accent); color: var(--ink-on-red); }
    .btn-accent:hover { background: var(--accent-2); }
    .btn-ghost { border: 1px solid var(--border); color: var(--fg); background: var(--surface); }
    .legend {
      display: flex; flex-wrap: wrap; gap: 10px 16px;
      margin-top: 16px; font-size: 0.75rem; color: var(--muted);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 14px; border-radius: 1px; display: inline-block; }
    .meta, code { font-family: var(--font-mono); font-size: 0.85em; }
    .err { color: var(--accent); padding: 20px; border: 1px solid var(--accent); border-radius: var(--radius); }
    @media (prefers-reduced-motion: reduce) {
      .book, .book-open, .book-open .page { animation: none; transition: none; }
      .book-open .page-left, .book-open .page-right { transform: none; }
      .book.opening .book-vol, .book.opened .book-vol,
      .book.opening .cover-face, .book.opened .cover-face,
      .book.opening .pages-edge, .book.opened .pages-edge { animation: none; }
    }
    `;

    function spineHeight(year) {
      const y = parseInt(year, 10) || 2000;
      const minH = 156;
      const maxH = 344;
      const t = Math.min(1, Math.max(0, (y - 2015) / 11));
      return Math.round(minH + t * (maxH - minH));
    }

    function filtered() {
      let list = [...state.pubs];
      if (state.filter !== 'all') {
        list = list.filter((p) => isTrue(p[state.filter]));
      }
      if (state.sort === 'year-desc') {
        list.sort((a, b) => (parseInt(b.year, 10) || 0) - (parseInt(a.year, 10) || 0));
      } else if (state.sort === 'year-asc') {
        list.sort((a, b) => (parseInt(a.year, 10) || 0) - (parseInt(b.year, 10) || 0));
      } else if (state.sort === 'title') {
        list.sort((a, b) => a.title.localeCompare(b.title));
      }
      return list;
    }

    function showTooltip(el, pub) {
      const tip = document.getElementById('book-tooltip');
      if (!tip) return;
      const rect = el.getBoundingClientRect();
      tip.innerHTML = `${pub.title}<span class="tt-year">${displayField(pub.year)} · ${displayField(pub.journal)}</span>`;
      tip.style.left = `${rect.left + rect.width / 2}px`;
      tip.style.top = `${rect.top}px`;
      tip.classList.add('visible');
    }

    function hideTooltip() {
      document.getElementById('book-tooltip')?.classList.remove('visible');
    }

    function renderOpenBook(sel) {
      const topics = topicsForPub(sel);
      const pills = topics.map((t) =>
        `<span class="pill" style="--pill-bg: var(--${t.key})">${t.label}</span>`,
      ).join('');
      const link = sel.link || sel.DOI ? (sel.link ? sel.link : `https://doi.org/${sel.DOI}`) : '';
      const pt = primaryTopic(sel);
      return `
        <div class="book-open" role="dialog" aria-label="Publication details">
          <div class="page page-left">
            <p class="page-eyebrow">${pt.label}</p>
            <p class="page-meta"><span class="num">${displayField(sel.year)}</span></p>
            <p class="page-meta">${displayField(sel.journal)}</p>
            ${displayField(sel.number) !== '-' ? `<p class="page-meta">${displayField(sel.number)}</p>` : ''}
            <div class="topic-pills">${pills || '<span class="pill" style="--pill-bg:var(--topic-default)">Uncategorized</span>'}</div>
          </div>
          <div class="page page-right">
            <p class="page-eyebrow">Publication</p>
            <h2>${sel.title}</h2>
            <p class="page-authors">${displayField(sel.authors)}</p>
            <div class="btn-row">
              ${link ? `<a class="btn btn-accent" href="${link}" target="_blank" rel="noopener">Open paper</a>` : ''}
              <button type="button" class="btn btn-ghost" id="close-detail">Close book</button>
            </div>
          </div>
        </div>`;
    }

    function render() {
      const list = filtered();
      const sel = state.selected;
      const chipHtml = [
        `<button type="button" class="chip${state.filter === 'all' ? ' active' : ''}" data-filter="all">All topics</button>`,
        ...TOPIC_KEYS.map(([key, label]) =>
          `<button type="button" class="chip${state.filter === key ? ' active' : ''}" data-filter="${key}">${label}</button>`,
        ),
      ].join('');

      const indexMap = new Map(list.map((p, i) => [`${p.title}::${p.year}`, i]));
      const rowBooks = list.map((pub) => {
          const globalIdx = indexMap.get(`${pub.title}::${pub.year}`);
          const pt = primaryTopic(pub);
          const h = spineHeight(pub.year);
          const selected = sel && sel.title === pub.title && sel.year === pub.year;
          const openClass = selected ? ' selected opened' : '';
          return `<button type="button" class="book${openClass}" data-idx="${globalIdx}" aria-label="${pub.title.replace(/"/g, '')}, ${displayField(pub.year)}">
            <span class="book-vol" style="--book-h:${h}px; --spine-color: var(--${pt.key})">
              <span class="spine">
                <span class="spine-gilt" aria-hidden="true"></span>
                <span class="spine-year">${displayField(pub.year)}</span>
              </span>
              <span class="pages-edge" aria-hidden="true"></span>
              <span class="cover-face" aria-hidden="true"></span>
            </span>
          </button>`;
        }).join('');

      const booksHtml = `<div class="shelf-unit" role="group" aria-label="Publication bookshelf">
          <div class="shelf-row">${rowBooks}</div>
          <div class="shelf-plank" aria-hidden="true"></div>
        </div>`;

      const legendHtml = TOPIC_KEYS.slice(0, 6).map(([, label, token]) =>
        `<span><i style="background:var(--${token})"></i>${label}</span>`,
      ).join('');

      const readerHtml = sel
        ? renderOpenBook(sel)
        : `<div class="reader-empty">Hover a spine for the full title — click to open the volume.</div>`;

      document.getElementById('app').innerHTML = `
        <style>${styles}</style>
        <div id="book-tooltip" class="book-tooltip" role="tooltip" aria-hidden="true"></div>
        <header class="head">
          <p class="eyebrow">Research library</p>
          <h1>Publications on the shelf</h1>
          <p class="lead">Each volume is one CSV row — scroll the single shelf horizontally, hover for titles, click to watch the spine open and read the spread below.</p>
        </header>
        <div class="toolbar">
          <div class="chips">${chipHtml}</div>
          <label>Sort <select id="sort-select">
            <option value="year-desc"${state.sort === 'year-desc' ? ' selected' : ''}>Newest first</option>
            <option value="year-asc"${state.sort === 'year-asc' ? ' selected' : ''}>Oldest first</option>
            <option value="title"${state.sort === 'title' ? ' selected' : ''}>Title A–Z</option>
          </select></label>
          <span class="count">${list.length} volumes</span>
        </div>
        <div class="shelf-stack" role="region" aria-label="Publication bookshelves">
          ${booksHtml || '<p class="meta">No publications match this filter.</p>'}
        </div>
        <div class="legend">${legendHtml}</div>
        <div class="reader-stage">${readerHtml}</div>
      `;

      document.querySelectorAll('.chip').forEach((el) => {
        el.addEventListener('click', () => {
          state.filter = el.dataset.filter;
          state.selected = null;
          render();
        });
      });
      document.getElementById('sort-select')?.addEventListener('change', (e) => {
        state.sort = e.target.value;
        render();
      });
      document.querySelectorAll('.book').forEach((el) => {
        const idx = parseInt(el.dataset.idx, 10);
        const pub = list[idx];
        el.addEventListener('mouseenter', () => showTooltip(el, pub));
        el.addEventListener('mouseleave', hideTooltip);
        el.addEventListener('focus', () => showTooltip(el, pub));
        el.addEventListener('blur', hideTooltip);
        el.addEventListener('click', () => {
          if (state.selected && state.selected.title === pub.title && state.selected.year === pub.year) {
            state.selected = null;
            render();
            return;
          }
          state.selected = pub;
          hideTooltip();
          render();
        });
      });
      document.getElementById('close-detail')?.addEventListener('click', () => {
        state.selected = null;
        render();
      });

      reportEmbedHeight();
    }

    try {
      const text = await loadText(DATA.publications);
      state.pubs = csvToObjects(text).filter((p) => p.title);
      render();
    } catch (e) {
      document.getElementById('app').innerHTML = `<p class="err">Could not load publications: ${e.message}. Serve this folder over HTTP (file:// blocks fetch).</p>`;
    }
  </script>
</body>
</html>
